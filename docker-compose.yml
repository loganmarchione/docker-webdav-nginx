version: '4'
services:
  webdav:
    container_name: docker-webdav-nginx
    restart: unless-stopped
    environment:
      - WEBDAV_USERS=user1:password1,user2:password2
      - NGINX_CLIENT_MAX_BODY_SIZE=500M
      - ADMIN_USER=admin
      - ADMIN_PASS=changeme
    image: loganmarchione-docker-webdav-nginx-cors:latest
    networks:
      - webdav
    ports:
      - '8888:80'
    volumes:
      - 'webdav:/var/www/webdav'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888"]
      interval: 30s

networks:
  webdav:

volumes:
  webdav:
    driver: local
    name: webdav_data1