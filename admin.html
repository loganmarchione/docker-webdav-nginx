<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDAV Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 2rem;
        }
        h1 { margin-bottom: 1.5rem; }
        .container { max-width: 700px; margin: 0 auto; }

        /* Add user form */
        .add-form {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .add-form h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }
        .form-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .form-row input {
            flex: 1;
            min-width: 140px;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .form-row input:focus { outline: none; border-color: #4a90d9; }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-add { background: #4a90d9; color: #fff; }
        .btn-add:hover { background: #3a7bc8; }
        .btn-remove { background: #e74c3c; color: #fff; font-size: 0.85rem; padding: 0.35rem 0.75rem; }
        .btn-remove:hover { background: #c0392b; }

        /* User table */
        .user-table {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }
        .user-table h2 {
            font-size: 1.1rem;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #ddd;
            background: #fafafa;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.65rem 1.25rem; text-align: left; }
        th { background: #fafafa; font-weight: 600; border-bottom: 1px solid #eee; }
        td { border-bottom: 1px solid #f0f0f0; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #f9f9f9; }
        .empty-msg { padding: 1.5rem; text-align: center; color: #999; }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }

        /* Status message */
        .status { margin-top: 0.5rem; font-size: 0.85rem; min-height: 1.2em; }
        .status.error { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebDAV User Management</h1>

        <div class="add-form">
            <h2>Add User</h2>
            <div class="form-row">
                <input type="text" id="new-username" placeholder="Username" autocomplete="off">
                <input type="password" id="new-password" placeholder="Password" autocomplete="new-password">
                <button class="btn btn-add" onclick="addUser()">Add</button>
            </div>
            <div class="status" id="add-status"></div>
        </div>

        <div class="user-table">
            <h2>Users</h2>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th style="text-align:right">Actions</th>
                    </tr>
                </thead>
                <tbody id="user-list">
                    <tr><td colspan="2" class="empty-msg">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const BASE = '/admin/api';

        async function loadUsers() {
            try {
                const res = await fetch(`${BASE}/users`);
                const data = await res.json();
                renderUsers(data.users);
            } catch (e) {
                document.getElementById('user-list').innerHTML =
                    '<tr><td colspan="2" class="empty-msg">Failed to load users</td></tr>';
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('user-list');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="empty-msg">No users configured</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${escapeHtml(u)}</td>
                    <td style="text-align:right">
                        <button class="btn btn-remove" onclick="removeUser('${escapeHtml(u)}')">Remove</button>
                    </td>
                </tr>
            `).join('');
        }

        async function addUser() {
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value;
            const status = document.getElementById('add-status');

            if (!username || !password) {
                status.textContent = 'Username and password are required';
                status.className = 'status error';
                return;
            }

            try {
                const res = await fetch(`${BASE}/users`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('new-username').value = '';
                    document.getElementById('new-password').value = '';
                    status.textContent = '';
                    showToast(data.message, 'success');
                    loadUsers();
                } else {
                    status.textContent = data.message;
                    status.className = 'status error';
                }
            } catch (e) {
                status.textContent = 'Request failed';
                status.className = 'status error';
            }
        }

        async function removeUser(username) {
            if (!confirm(`Remove user "${username}"?\n\nThis will delete their directory and all files in it.`)) {
                return;
            }

            try {
                const res = await fetch(`${BASE}/users/${encodeURIComponent(username)}`, {
                    method: 'DELETE'
                });
                const data = await res.json();

                if (data.success) {
                    showToast(data.message, 'success');
                    loadUsers();
                } else {
                    showToast(data.message, 'error');
                }
            } catch (e) {
                showToast('Request failed', 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Handle Enter key in form fields
        document.getElementById('new-username').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('new-password').focus();
        });
        document.getElementById('new-password').addEventListener('keydown', e => {
            if (e.key === 'Enter') addUser();
        });

        // Load users on page load
        loadUsers();
    </script>
</body>
</html>
